name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mimesis==19.1.0
        pip install scipy==1.17.1
        pip install Pillow==11.3.0
        pip install numpy==2.4.3
        pip install tqdm==4.67.3
        pip install arcade==3.3.3
      shell: cmd

    - name: Create test directories
      run: |
        mkdir test_datas\images
        mkdir test_datas\music
        mkdir test_datas\sounds
        mkdir test_datas\lores
      shell: cmd
    
    - name: Run tests
      run: |
        python -m unittest discover -s engine -p "tests.py"
      shell: cmd
